version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      runtime-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
      tooling-minor-and-patch:
        dependency-type: development
        update-types: [minor, patch]
    # Major upgrades stay in individual PRs for compatibility review.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
